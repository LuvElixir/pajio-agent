[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pajio"
version = "0.2.0"
description = "A device-first personal agent workspace built around Hermes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "psutil>=7,<8",
    "filelock>=3.20,<4",
    "pyyaml>=6,<7",
    "pydantic>=2.10,<3",
    "authlib>=1.6.5,<2",
    "itsdangerous>=2.2,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "mcp>=1.20,<2",
    "tzdata>=2025.2",
    "croniter>=6,<7",
    "pillow>=11,<13",
    "lark-oapi>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
cloud = [
    "psycopg[binary]>=3.2,<4",
]
connector = ["mcp>=1.20,<2"]
capture = ["av>=15,<17", "websockets>=15,<17"]
private-media = ["aiortc>=1.14,<2", "mss>=10,<11"]

[project.scripts]
pajio = "pajio.cli:main"

[project.urls]
Repository = "https://github.com/LuvElixir/pajio-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/pajio"]
# Include web assets explicitly, regardless of inherited VCS ignore rules.
exclude = ["src/pajio/web/**"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "pajio/THIRD_PARTY_NOTICES.md"
"src/pajio/web" = "pajio/web"
"deploy/control/postgres-roles.sql" = "pajio/cloud/postgres-roles.sql"

[tool.hatch.build.targets.sdist]
include = ["src/pajio", "tests", "docs", "deploy", "pyproject.toml", "uv.lock", "README.md", "README.zh-CN.md", "PRODUCT.md", "THIRD_PARTY_NOTICES.md"]
exclude = ["docs/archive", "**/__pycache__"]

[tool.hatch.build.targets.sdist.force-include]
"src/pajio/web" = "src/pajio/web"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
